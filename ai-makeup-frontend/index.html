<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Beauty Try-On Plugin</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <!-- tailwind.css 是預先編譯好的靜態檔（取代 cdn.tailwindcss.com 的執行期編譯）。
         新增或修改 HTML/JS 裡的 Tailwind class 後要重新產生，指令見 repo 根目錄的 tailwind.config.js -->
    <link rel="stylesheet" href="tailwind.css">
    <!-- MediaPipe 鎖定版本：不鎖的話 CDN 會直接給最新版，上游一改就可能壞掉。
         script.js 的 locateFile 也要用同一個版本號 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-[#8C8B85]">

<div id="app-shell" class="max-w-md mx-auto min-h-screen flex flex-col bg-[#F7F6F3] relative">

    <div id="start-screen" class="absolute inset-0 flex flex-col items-center p-8 pt-16 pb-10 text-center transition-opacity duration-700">
        <p id="onboarding-eyebrow" class="eyebrow text-[10px] font-medium text-[#8C8B85]">AI BEAUTY</p>
        <h2 id="onboarding-heading" class="text-[#26251F] text-[17px] font-medium mt-3">開啟鏡頭並開始試妝</h2>

        <div class="viewfinder mx-auto mt-14 flex items-center justify-center">
            <span class="vf-corner tl"></span>
            <span class="vf-corner tr"></span>
            <span class="vf-corner bl"></span>
            <span class="vf-corner br"></span>
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#26251F" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 8h2.5l1.2-2h8.6l1.2 2H20a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/>
                <circle cx="12" cy="13" r="3.3"/>
            </svg>
        </div>

        <div id="onboarding-guidance" class="mt-14 w-full text-left space-y-4">
            <div class="flex items-center gap-3">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5F7A5E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>
                </svg>
                <p class="text-[12.5px] text-[#26251F]">建議面向光源、確保光線充足</p>
            </div>
            <div class="flex items-center gap-3">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5F7A5E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0">
                    <circle cx="12" cy="12" r="8"/>
                    <path d="M9 10h.01M15 10h.01M9 15c1 1 5 1 6 0"/>
                </svg>
                <p class="text-[12.5px] text-[#26251F]">建議素顏或淡妝以獲得最佳效果</p>
            </div>
            <div class="flex items-center gap-3">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5F7A5E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0">
                    <path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/>
                </svg>
                <p class="text-[12.5px] text-[#26251F]">臉部偵測於本機即時運算，不會保存或上傳臉部影像；使用「AI 智慧推薦」時，僅會傳送本機分析出的膚色、臉型與候選色號等文字資訊供 AI 判斷，不傳送照片或截圖，也不會被儲存。</p>
            </div>
        </div>

        <button id="init-btn" class="btn-primary text-white w-full py-[13px] rounded-[10px] text-[13.5px] font-medium mb-3 mt-10">開啟鏡頭</button>
        <p id="onboarding-helper" class="text-[#8C8B85] text-[10px]">點擊即表示允許瀏覽器存取攝影機</p>
    </div>

    <header id="app-header" class="p-5 text-center bg-[#F7F6F3]">
        <h1 class="eyebrow text-[11px] font-medium text-[#8C8B85]">AI Beauty Try-On Plugin</h1>
        <div class="h-px w-8 bg-[#E7E5DE] mx-auto mt-2"></div>
        <p class="eyebrow text-[10px] text-[#8C8B85] mt-2 font-medium">Smart Analysis System</p>
    </header>

    <main id="app-content" class="flex-grow px-6 opacity-0 transition-opacity duration-1000 overflow-y-auto pb-10">
        <div class="vto-container mt-4 relative">
            <div id="loading-overlay" class="absolute inset-0 z-50 bg-[#F7F6F3]/90 flex flex-col items-center justify-center">
                <div class="w-8 h-8 border-2 border-[#E7E5DE] border-t-[#26251F] rounded-full animate-spin"></div>
                <p class="eyebrow text-[10px] mt-4 text-[#26251F] font-medium">AI Scanning...</p>
            </div>
            <div id="scan-bar" class="scan-line z-20"></div>
            <video id="video-element" playsinline muted autoplay></video>
            <canvas id="output-canvas"></canvas>
            <div id="undertone-badge" class="hidden absolute top-4 left-4 z-30 items-center gap-1.5 bg-white border border-[#E7E5DE] rounded-full px-3 py-1.5">
                <span class="w-1.5 h-1.5 rounded-full bg-[#5F7A5E] flex-shrink-0"></span>
                <span id="undertone-label" class="whitespace-nowrap text-[10px] font-medium text-[#26251F]"></span>
            </div>
            <div class="absolute bottom-6 left-6 right-6 flex justify-between items-center z-10">
                <div class="flex items-center gap-3">
                    <button id="compare-btn" class="w-9 h-9 bg-white rounded-full flex items-center justify-center border border-[#E7E5DE] active:opacity-80 transition">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#26251F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="16" rx="2"/>
                            <line x1="12" y1="4" x2="12" y2="20"/>
                            <path d="M9 10l-2 2 2 2"/>
                            <path d="M15 10l2 2-2 2"/>
                        </svg>
                    </button>
                    <button id="save-btn" class="w-9 h-9 bg-white rounded-full flex items-center justify-center border border-[#E7E5DE] active:opacity-80 transition">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#26251F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 8h2.5l1.2-2h8.6l1.2 2H20a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/>
                            <circle cx="12" cy="13" r="3.3"/>
                        </svg>
                    </button>
                </div>
                <button id="ai-analyze-btn" class="bg-white px-4 py-3 rounded-full border border-[#E7E5DE] flex items-center justify-center group active:opacity-80 transition">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="#5F7A5E" class="flex-shrink-0">
                        <path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2z"/>
                    </svg>
                    <span id="ai-analyze-label" class="whitespace-nowrap text-[10px] font-medium ml-2 text-[#26251F]">AI 智慧分析推薦</span>
                </button>
            </div>
        </div>

        <div id="sidebar-panel">
            <div id="ai-result-panel" class="hidden mt-6 bg-white rounded-xl border border-[#E7E5DE] overflow-hidden">
                <button id="ai-toggle-btn" type="button" aria-expanded="true" aria-controls="ai-detail-wrap" class="w-full flex items-start p-4 text-left">
                    <div class="p-2 bg-[#F7F6F3] rounded-lg mr-3 flex-shrink-0">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-[#5F7A5E]" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
                        </svg>
                    </div>
                    <div class="flex-grow min-w-0">
                        <div class="flex items-center justify-between">
                            <h4 class="text-xs font-medium text-[#26251F]">AI 智能分析報告</h4>
                            <svg id="ai-toggle-chevron" class="h-3 w-3 text-[#8C8B85] flex-shrink-0 ml-2 transition-transform duration-200" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 111.06 1.06l-4.24 4.24a.75.75 0 01-1.06 0L5.21 8.29a.75.75 0 01.02-1.08z" clip-rule="evenodd" />
                            </svg>
                        </div>
                        <p id="ai-summary-text" class="text-[10px] text-[#26251F] font-semibold mt-1"></p>
                    </div>
                </button>
                <div id="ai-detail-wrap" class="px-4 pb-4 pl-11">
                    <p id="ai-analysis-text" class="text-[10px] text-[#8C8B85] leading-relaxed">正在解析...</p>
                </div>
            </div>

            <div class="mt-6">
                <div class="flex space-x-5 mb-5 text-[#8C8B85] text-[10px] tracking-widest overflow-x-auto no-scrollbar border-b border-[#E7E5DE]">
                    <button onclick="changeUIMode('lip')" id="tab-lip" class="pb-2 active-tab whitespace-nowrap uppercase">唇妝</button>
                    <button onclick="changeUIMode('eye')" id="tab-eye" class="pb-2 whitespace-nowrap uppercase">眼妝</button>
                    <button onclick="changeUIMode('base')" id="tab-base" class="pb-2 whitespace-nowrap uppercase">底妝</button>
                </div>
                <div class="min-h-[140px]">
                    <div id="lip-panel" class="block">
                        <div class="swatch-scroll-wrap">
                            <div class="flex space-x-4 overflow-x-auto pb-4 no-scrollbar" id="lip-selector" style="flex-wrap:nowrap; min-width:0;"></div>
                        </div>
                    </div>
                    <div id="eye-panel" class="hidden">
                        <div class="swatch-scroll-wrap">
                            <div class="flex space-x-4 overflow-x-auto pb-4 no-scrollbar" id="eye-selector" style="flex-wrap:nowrap; min-width:0;"></div>
                        </div>
                    </div>
                    <div id="base-panel" class="hidden">
                        <div class="swatch-scroll-wrap">
                            <div class="flex space-x-4 overflow-x-auto pb-4 no-scrollbar" id="base-selector" style="flex-wrap:nowrap; min-width:0;"></div>
                        </div>
                    </div>
                </div>

                <!-- 濃淡：只調整目前分頁（唇/眼/底）那一類，每一類各自記住自己的值 -->
                <div id="intensity-wrap" class="flex items-center gap-3 mt-1">
                    <label for="intensity-slider" id="intensity-label" class="text-[10px] text-[#8C8B85] whitespace-nowrap">唇妝濃淡</label>
                    <input id="intensity-slider" type="range" min="20" max="150" step="5" value="100" class="flex-grow">
                    <span id="intensity-value" class="text-[10px] font-medium text-[#26251F] w-9 text-right">100%</span>
                </div>
            </div>
        </div>
    </main>

</div>

<script src="script.js"></script>
</body>
</html>
